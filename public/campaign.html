<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign · CareFund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2621;--mute:#66706a;--line:#e3e1d9;--brand:#0f6b54;--brand2:#e7f2ee;--warn:#b7791f;--warnbg:#fdf4e3;--bad:#b42318;--badbg:#fdecea;--ok:#127a4a;--okbg:#e6f5ec}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:#fff}
.logo{font-family:Fraunces,serif;font-size:21px;color:var(--brand);text-decoration:none}.logo span{color:var(--ink)}
header a.make{font-size:13px;color:var(--mute)}
main{max-width:760px;margin:0 auto;padding:18px 16px 10px}
.demo{background:var(--warnbg);color:#7a4f0e;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.camp{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hero{background:linear-gradient(135deg,#0f6b54,#2a9d7f);color:#fff;padding:22px 20px}
.pill{display:inline-block;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px;font-size:12px;margin:0 6px 6px 0}
.pill.ok{background:#fff;color:var(--ok);font-weight:600}.pill.pending{background:#fdf4e3;color:#7a4f0e;font-weight:600}
h1{font-family:Fraunces,serif;font-size:27px;line-height:1.2;margin:8px 0 8px}
.summary{opacity:.95}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.facts div{background:#fff;padding:12px 14px}.facts b{display:block;font-size:17px}.facts small{color:var(--mute);font-size:12px}
@media(max-width:560px){.facts{grid-template-columns:1fr}h1{font-size:23px}}
.share{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.btn{border:0;border-radius:9px;padding:9px 15px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.wa{background:#1fa855}
.story{padding:18px 20px;white-space:pre-wrap;line-height:1.7}
.guarantee{margin:0 20px 18px;background:var(--brand2);color:var(--brand);border-radius:10px;padding:10px 12px;font-size:13.5px}
.chat{border-top:1px solid var(--line);padding:16px 20px;background:#fcfcfa}
.chat h2{font-size:15px;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:#fff}
.msgs{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.m{padding:8px 12px;border-radius:12px;max-width:85%;font-size:14px}.m.q{align-self:flex-end;background:var(--brand);color:#fff}
.m.a{align-self:flex-start;background:#fff;border:1px solid var(--line)}.m small{display:block;color:var(--mute);margin-top:4px;font-size:11px}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
.err{background:var(--badbg);color:var(--bad);border-radius:12px;padding:18px;text-align:center}
.loading{color:var(--mute);text-align:center;padding:60px 0}
footer{color:var(--mute);font-size:12px;text-align:center;padding:14px 16px 30px}
</style>
</head>
<body>
<header><a class="logo" href="/">Care<span>Fund</span></a><a class="make" href="/">How this was verified →</a></header>
<main id="page"><div class="loading">Loading campaign…</div></main>
<footer>CareFund is a portfolio demo by Niket Korgaonkar. All people in the samples are fictional.</footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TOKEN = location.hash.slice(1);   // the signed campaign lives in the URL fragment
let CHAT = [];

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || "Request failed");
  return d;
}

async function load() {
  if (!TOKEN) { $("page").innerHTML = `<div class="err">This link has no campaign in it. Ask the organiser to share the full link.</div>`; return; }
  try {
    const d = await post("/api/campaign/view", {token: TOKEN});
    render(d);
  } catch (e) {
    $("page").innerHTML = `<div class="err"><b>We couldn't verify this campaign.</b><br>${esc(e.message)}</div>`;
  }
}

function render(d) {
  const c = d.campaign, live = d.status === "live";
  document.title = c.title + " · CareFund";
  const url = location.href, text = `${c.summary} ${url}`;
  $("page").innerHTML = `
    <div class="demo">Portfolio demo: this page shows how a verified campaign would look. No real donations are collected.</div>
    <article class="camp">
      <div class="hero">
        <span class="pill">${esc(c.category)}</span>
        <span class="pill ${live ? "ok" : "pending"}">${live ? "✓ Documents verified" : "Verification pending"}</span>
        <h1>${esc(c.title)}</h1>
        <div class="summary">${esc(c.summary)}</div>
      </div>
      <div class="facts">
        <div><b>${esc(c.goal_display)}</b><small>Goal</small></div>
        <div><b>${esc(c.hospital)}</b><small>Funds are paid to</small></div>
        <div><b>${live ? "Verified" : "Under review"}</b><small>Risk review: ${esc(c.risk_level)}</small></div>
      </div>
      <div class="share">
        <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text)}">Share on WhatsApp</a>
        <button class="btn ghost" onclick="copyLink(this)">Copy link</button>
        ${navigator.share ? `<button class="btn ghost" onclick="nativeShare()">Share…</button>` : ""}
      </div>
      <div class="story">${esc(c.body)}</div>
      <div class="guarantee">Money raised is paid directly to ${esc(c.hospital)} against the hospital's estimate, never to a personal account or UPI ID.</div>
      <div class="chat">
        <h2>Questions? Ask about this campaign</h2>
        <div class="chips">${["Where does my money go?", "How much is still needed?", "Is this campaign genuine?", "Who is the doctor?", "Can I get a tax receipt?"]
          .map(q => `<span class="chip" onclick="ask(this.textContent)">${q}</span>`).join("")}</div>
        <div class="msgs" id="msgs"></div>
        <div class="inline"><input id="q" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Ask</button></div>
      </div>
    </article>`;
  window._share = {title: c.title, text: c.summary, url};
}

function chatHtml(m) {
  return m.q ? `<div class="m q">${esc(m.q)}</div>` : `<div class="m a">${esc(m.answer)}${m.mode === "guardrail" ? "<small>medical questions go to the treating doctors</small>" : ""}</div>`;
}

async function ask(q) {
  q = (q || $("q").value).trim(); if (!q) return;
  CHAT.push({q}); $("q").value = ""; $("msgs").innerHTML = CHAT.map(chatHtml).join("");
  try { CHAT.push(await post("/api/donor/ask", {question: q, campaign_token: TOKEN})); }
  catch (e) { CHAT.push({answer: "Sorry, something went wrong: " + e.message}); }
  const m = $("msgs"); m.innerHTML = CHAT.map(chatHtml).join(""); m.scrollTop = m.scrollHeight;
}

async function copyLink(btn) {
  try { await navigator.clipboard.writeText(location.href); btn.textContent = "Copied ✓"; }
  catch { prompt("Copy this link:", location.href); }
  setTimeout(() => btn.textContent = "Copy link", 1500);
}
function nativeShare() { navigator.share(window._share).catch(() => {}); }

load();
</script>
</body>
</html>
